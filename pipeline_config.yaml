pipeline_version: "2.2.0"

# Storage is configured by environment variables, NOT edited here. Defaults live in
# scripts/mito_env.bash (all derive from MITO_DATA_ROOT). To use shared lab storage:
#   export MITO_DATA_ROOT=/sciclone/data10/<lab_group>/mito_pipeline
paths:
  raw_ometiff_root: "${MITO_RAW_ROOT}"
  scratch_work_root: "${MITO_SCRATCH_ROOT}"
  models_dir: "${MITO_MODELS_DIR}"
  final_output_root: "${MITO_OUTPUT_ROOT}"
  ilastik_bin: "${MITO_ILASTIK_BIN}"    # ilastik 1.4.2 installed by scripts/setup_hpc_env.bash
  mitolandscape_repo: "${MITO_TOOLS_DIR}/MitoLandscape" # Pinned clone of https://github.com/enricoenne/MitoLandscape (reference only; not imported)

metadata_defaults:
  channel_mito: 1               # 1-indexed in ImageJ (mito-EGFP)
  channel_cell: 2               # 1-indexed in ImageJ (tagRFP-T cytosol)
  expected_xy_um: 0.16          # Fallback only if OME-XML PhysicalSizeX is missing
  expected_z_um: 1.00           # Fallback only if OME-XML PhysicalSizeZ is missing
  expected_dt_s: 11.7           # Fallback only if OME-XML TimeIncrement is missing

stage3_preprocessing:
  raw_signal_qc:
    min_contrast_sigma: 3.0     # Raw mito channel: (in-cell P99.9 - background median) / per-frame noise SD.
                                # Below this the movie is FAIL_NO_SIGNAL and the Slurm job stops before Stage 4
                                # (practice Series #20 ch1 measured ~0; override per run with MITO_IGNORE_QC=1).
  drift_correction:
    enabled: true
    engine: "Fast4DReg"         # Pylvänäinen et al. (2023) J. Cell Sci. (4x-70x faster than Correct 3D drift)
    reference_channel: 2        # Estimate drift strictly on tagRFP-T cell arbor, then apply to Ch1 (mito-EGFP)
    xy_projection_type: "Max_Intensity"
    z_projection_type: "Max_Intensity"
    time_averaging: 1           # Frames to average during cross-correlation
    max_shift_xy_px: 25         # Max drift CHANGE between consecutive frames (px); total drift may exceed it
    max_shift_z_px: 5           # Max drift CHANGE between consecutive frames (slices)
    qc_max_total_drift_um: 15.0 # Flag warning in JSON if cumulative drift > 15 um

  auto_crop_3d:
    enabled: true
    reference_channel: 2
    padding_xy_um: 5.0          # Pad 5 um around 3D cell bounding box in X,Y
    padding_z_um: 2.0           # Pad 2 slices above/below cell in Z

  cytosolic_roi_gate:
    enabled: true               # Isolates single-cell glial territory (Baldwin et al., 2025; Negri et al., 2025)
    gaussian_sigma_xy_px: 2.0
    gaussian_sigma_z_px: 1.0
    threshold_method: "Triangle" # Triangle thresholding captures dim radial shafts
    background_sigma_xy_um: 5.0 # Broad out-of-focus glow subtracted before thresholding (0 = off)
    background_sigma_z_um: 3.0
    keep_largest_cc: true       # MorphoLibJ largest 3D connected component -> saved as *_cell_mask.tif
    dilation_radius_um: 1.5     # Dilate by 1.5 um to gate Ch1 (mito-EGFP) extracellular noise

  z_attenuation_correction:
    enabled: true
    trigger_drop_ratio: 0.30    # Apply a smooth depth gain if the CYTOSOLIC channel (in-cell signal above background)
                                # fitted with an exponential drops >30% across the cell; never histogram-matches slices
    max_gain: 3.0               # Cap on the depth gain applied to the mito channel

  bleach_correction:
    enabled: true
    method: "Histogram Matching" # Miura (2020) F1000Research; applied across T

  denoising:
    median_xy_radius_px: 1.0    # Removes 1-px sCMOS/EMCCD shot-noise spikes (Chaudhry et al., 2020)
    rolling_ball_radius_px: 15.0 # ~2.4 um radius; strips diffuse cytoplasmic GFP haze
    sliding_paraboloid: true

  intensity_normalization:
    enabled: true
    low_percentile: 1.0         # Mapped to 0 in uint16
    high_percentile: 99.9       # Mapped to 50000 in uint16 (leaves headroom to 65535)
    target_max_uint16: 50000
    min_snr_gate: 2.5           # Flag low-SNR warning if (P_99.9 / P_50) < 2.5

stage4_hybrid_segmentation:
  stage4a_ilastik:
    enabled: true
    project_file: "bestman_mito_2d_v3.ilp"  # v3 (2026-11-24): S39 frames 0/2/5, 2D features, 44% in-cell Background; v2 failed (99% of cell called mito)
    export_source: "Probabilities"
    foreground_class_index: 0   # Channel 0 of exported probabilities = Mitochondria
    feature_mode: "2D_slices"   # Prevents 1.0 um Z-step blur across adjacent planes
    max_foreground_fraction_of_cell: 0.5 # Stage 4 stops (exit 5) if P>threshold covers more of the cell mask than this;
                                        # mitochondria fill a minority of cytoplasm (v2 .ilp: 99% -> retrain)

  stage4b_instance_segmentation:
    # Stage 4B separates TOUCHING mitochondria: ilastik's foreground merges organelles that lie
    # end-to-end/side-by-side in a thin process into one region; counts, volumes and fission/fusion
    # are only meaningful after that region is split into individual instances.
    engine: "watershed"         # "watershed" (default; seeded 3D watershed, CPU, seconds/frame)
                                # "cellpose"  (Cellpose 3, industry standard; auto-uses a GPU when present)
                                # Default chosen 2026-11-24 from practice Series #39 (frame 0): watershed
                                # 100% foreground coverage, 103 objects, 5 s; Cellpose cyto3 18% coverage,
                                # 7 objects (45% of their area outside mitochondria), 433 s on CPU, missed
                                # all puncta along the process. Suspected cause: cyto3 is a whole-CELL model
                                # (objects ~30 px, textured) while mitochondria are 2-6 px puncta/rods.
                                # Re-evaluate on the representative real-data sample (manuals/
                                # future_task_representative_sample_validation.md), incl. GPU + fine-tuned models.
    foreground_probability_threshold: 0.5 # Foreground = ilastik P > this; both engines work only inside it (+ margin)
    min_object_mean_probability: 0.5      # Drop instances whose mean ilastik P is below this (noise objects)
    min_volume_um3: 0.10        # Physical volume floor (~3 voxels at 0.19 x 0.19 x 1.0 um); was 0.05 (MitoLandscape),
                                # raised to drop 1-2 voxel noise specks seen on Series #39

    watershed:                  # engine: "watershed"
      seed_min_separation_xy_um: 0.4 # Two seeds (= two organelles) must be >= this far apart in XY ...
      seed_min_separation_z_um: 1.0  # ... and in Z. Smaller = more splitting (risk: one rod cut in two);
                                     # larger = less splitting (risk: touching organelles merged).
      seed_min_prominence_um: 0.05   # A peak must rise >= this (um of distance-to-edge) above the dip between
                                     # neighbours to become its own organelle; suppresses double seeds on flat tops.
      temporal_seeding: true         # Use the previous frame's instances to stop split/merge flicker (sequential frames)
      temporal_split_hysteresis: 2.0 # Splitting an object that was single last frame needs this x seed_min_prominence_um
      temporal_merge_boundary_ratio: 0.95 # Previously separate objects merge only if the boundary is >= this x dimmer peak (no dip)
      temporal_merge_boundary_percentile: 90 # Boundary statistic for that test. Synthetic sweep 2026-11-24 (3 seeds): p90@0.95 best
                                             # (F1 0.86-0.90, crowded 74-82%, touching 70-75/90, true events 2-3/3 each); mean was too strict

    # engine: "cellpose" settings
    model_type: "cyto3"         # Stock whole-cell model; or path to a fine-tuned mitochondria model (.pth)
    input_mode: "dual_channel"  # Stack [Ch1: mito_norm, Ch2: ilastik_prob]
    diameter_px: 8.0            # Expected object diameter in px (Cellpose upsamples by ~30/diameter -> slow on CPU)
    flow_threshold: 0.40        # Higher = more permissive instance splitting
    cellprob_threshold: 0.0     # Logit threshold (0.0 corresponds to P = 0.50)
    do_3d: false                # Disable isotropic 3D; use 2D + Z-stitching for 1.0 um Z
    stitch_threshold: 0.35      # 2D-to-3D mask IoU stitching threshold across Z slices

stage5_tracking_and_mitolandscape:
  trackmate_detector:
    type: "LabelImageDetector"  # Reads integer instance masks from Stage 4B
    simplify_contours: true

  sparse_lap_tracker:
    linking_max_distance_um: 2.5
    linking_feature_penalties:
      VOLUME: 1.0               # Penalize linking objects of drastically different volume
    allow_gap_closing: true
    gap_closing_max_distance_um: 3.0
    max_frame_gap: 2
    allow_track_splitting: true # Mitochondrial Fission
    splitting_max_distance_um: 2.0
    allow_track_merging: true   # Mitochondrial Fusion
    merging_max_distance_um: 2.0
    split_merge_max_intensity_ratio: 1.5 # Fission/fusion only if parent/(daughter1+daughter2) mito signal is in [1/1.5, 1.5]
    min_event_persistence_frames: 3      # Daughters/sources must persist >= N frames; split undone by a merge within N frames = flicker (removed).
                                         # Synthetic realistic benchmark (2026-11-24): 2 -> 25+38 predicted events, 3 -> 23+32, vs 3+3 true;
                                         # crowded-region event calls remain unreliable (see manuals/future_task_representative_sample_validation.md)
    min_track_spots: 4          # Keep trajectories present in >= 4 timepoints

  snt_autotrace:
    enabled: true
    tubeness_scales_um: [0.4, 0.8, 1.2, 1.6]
    soma_detection: "EDT_Threshold"
    max_mito_to_arbor_dist_um: 3.5 # Max radial distance to map a spot onto SNT path

  mitolandscape_integration:
    enabled: true               # Integrates Negri, Fernández, & Borrell (2025) Front. Cell Dev. Biol.
    connectivity_3d: 26         # 26-voxel neighborhood for 3D mitochondrial graph skeletonization
    minor_process_cutoff_um: 5.0 # Processes shorter than 5.0 um merged into soma compartment (id=1)
    process_slice_thickness_um: 0.5 # Geodesic distance bin width along twisted radial process (default: 0.5 um)
    apical_basal_orientation_axis: "Y" # Axis pointing toward ventricular surface for apical (id=2) vs basal (id=3)
    motility_velocity_threshold_um_s: 0.02 # |v_axial| > 0.02 um/s classified as active anterograde/retrograde

# ------------------------------------------------------------------------------------------------
# Full-archive orchestration (scripts/submit_full_run.bash + scripts/plan_full_run.py).
# Read by plan_full_run.py with a small standard-library parser: keep this block to nested
# "key: value" mappings, scalars and inline [lists] (no anchors, no multi-line strings).
# Playbook: manuals/full_run_playbook.md
# ------------------------------------------------------------------------------------------------
hpc_run:
  primary_cluster: "bora"
  primary_partition: "batch"
  large_partition: "hima"         # L-class movies (big memory) go to hima CPU nodes ...
  large_exclude_gpu_nodes: true   # ... never to the GPU nodes (found live: nodes with a 'gpu' feature/GRES)
  large_gpu_nodes_fallback: [hi04, hi05, hi07]  # used only when sinfo cannot be queried
  footprint_fraction: 0.20        # never hold more than 20% of a partition's cores at once
  partition_cores_fallback:       # used only when sinfo cannot be queried (bora batch 45 x 20 cores)
    batch: 900
    hima: 128                     # 4 CPU nodes x 32 cores (GPU nodes excluded)
  partition_max_mem_gb:           # largest request one node can satisfy (fallbacks; refreshed via sinfo)
    batch: 120
    hima: 1000
  scan_throttle: 20               # concurrent scan tasks (showinf reads .sld over NFS)
  extract_throttle: 20            # concurrent extraction tasks (bfconvert, I/O-bound)
  max_array_size: 1000            # bora MaxArraySize is 1001 -> lists are chunked at <= 1000 tasks
  run_root: ""                    # "" = $MITO_SCRATCH_ROOT/../mito_runs (= /sciclone/scr30/$USER/mito_runs)
  log_root: ""                    # "" = /sciclone/scr30/$USER/mito_logs
  job_name_prefix: "mito"

  collector:                      # must be identical for scan and extract
    min_z: 15
    min_t: 10
    min_c: 2
    compression: "LZW"
    extract_labels: [MITO]        # mito_label values to extract; files with no label (filter off) always pass
    files_per_scan_shard: 5       # ~1-3 min of showinf per file -> <= ~15 min per scan task

  scan:
    cpus: 1
    mem_gb: 4
    time: "00:30:00"
  merge:
    cpus: 1
    mem_gb: 2
    time: "00:15:00"
  extract:
    cpus: 2                       # bfconvert JVM
    mem_gb: 6
    sec_per_gb: 115               # measured ~9 MB/s per bfconvert stream
    sec_base: 300                 # JVM start + showinf re-inspection of the file
    time_unknown: "04:00:00"      # request when the inventory is not merged yet (chained submission)
  aggregate:
    cpus: 1
    mem_gb: 4
    time: "00:30:00"

  size_classes:                   # by estimated_uncompressed_gb of the movie (inventory)
    names: [S, M, L]
    edges_gb: [2.0, 8.0]          # S < 2 GB <= M < 8 GB <= L
    large_class: "L"              # this class runs on large_partition

  model:                          # seeded from 2026-11-24 measurements; refit from the canary (sacct)
    stage3_mem_gb_per_gb: 2.75    # peak RSS = 2.5-3x the uncompressed movie ...
    stage3_mem_gb_base: 0.5       # ... + ~0.5 GB (S20 1.15 GB -> 3.0 GB; S39 1.38 GB -> 3.5 GB)
    stage3_sec_per_gb: 65         # Stage 3 = 80-90 s for 1.2-1.4 GB raw, linear in size
    stage3_cpus: 1                # Stages 3 and 5 are single-threaded (job 703660: CPU time = wall time)
    stage45_cpus: 4               # ilastik threads + parallel watershed frames
    stage45_mem_gb_per_gb: 2.75   # same per-movie arrays as Stage 3 (mito_norm, probabilities, labels)
    stage45_mem_gb_base: 1.5      # + ilastik/LazyFlow overhead
    stage45_mem_per_worker_frame: 8.0  # each parallel watershed worker holds ~8x one frame of one channel
    ilastik_sec_per_channel_gb: 290    # S20: ~3 min for 10 frames (0.62 GB mito channel) ...
    ilastik_thread_saturation: 4       # ... speed-up assumed linear up to 4 threads, flat beyond
    watershed_sec_per_channel_gb: 74   # 7-10 s per frame on S39 (0.115 GB per mito frame)
    stage5_sec: 60                # Stage 5 ~1 min
    default_size_t: 10            # used when the inventory has no SizeT for a movie
    default_size_c: 2
    time_factor: 2.0              # time request = 2x predicted ...
    min_time_min: 10              # ... at least 10 min
    mem_factor: 1.5               # memory request = 1.5x predicted ...
    min_mem_gb: 2                 # ... at least 2 GB
    refit_min_scale: 0.5          # canary refit may shrink the model at most 2x ...
    refit_max_scale: 4.0          # ... and grow it at most 4x

  canary_size: 10                 # ~10 movies spanning the size classes
  retry_factor: 1.5               # retry: memory and time x 1.5 per attempt
  max_retries: 2

  overflow:                       # other SciClone clusters, ONLY when bora is saturated (opt-in: --overflow)
    clusters: [kuro, astral]      # allowlist; [] disables overflow entirely
    partitions:                   # partition per cluster (kuro 'batch' needs >= 2 whole nodes, so 'serial')
      kuro: "serial"
      astral: "batch"
    deny_clusters: [chesapeake, james, potomac, pamunkey, gulf]
                                  # chesapeake = the VIMS (Gloucester Point) cluster per W&M RC; james/potomac/
                                  # pamunkey = its sub-cluster names (unverified, denied to be safe). gulf: not
                                  # confirmed VIMS, but its partitions are PreemptMode=CANCEL with QOS preemption.
    require_preempt_mode: "OFF"   # refuse any partition whose live PreemptMode is not OFF
    pending_threshold_min: 30     # bora counts as saturated when our tasks have waited this long
